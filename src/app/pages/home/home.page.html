<ion-content class="ion-padding">

  <ion-card class="schedule-card">
    <ion-card-header>
      <ion-card-title>Sunday, June X</ion-card-title>
    </ion-card-header>

    <ion-card-content>
      <ion-item *ngFor="let item of lineup" lines="none" class="role-item">
        <ion-label>{{ item.role }}</ion-label>
        <ion-badge [color]="getBadgeColor(item.status)">
          {{ item.status }}
        </ion-badge>
      </ion-item>
    </ion-card-content>
  </ion-card>

  <ion-card class="rehearsal-card">
    <ion-card-header>
      <ion-card-title>Rehearsal Day</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <p>Saturday 00:00</p>
      <p>Devotion host - Bro. Alden</p>
      <p>Devotion speaker - Bronny</p>
    </ion-card-content>
  </ion-card>

  <div class="role-info">
    <div *ngIf="authService.isAdmin()">Welcome, Admin!</div>

    <div *ngIf="authService.hasRole('Worship Leader')">Welcome, Worship Leader!</div>

    <div *ngIf="authService.hasRole('Backup')">Welcome, Member!</div>

    <div *ngIf="authService.hasRole('Main Keyboard')">You play Main Keyboard.</div>
  </div>

</ion-content>
