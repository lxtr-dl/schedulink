<ion-header class="profile-header-container">
  <ion-toolbar>
    <!-- Back button to return to tabs -->
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Profile Menu</ion-title>
  </ion-toolbar>

  <!-- Profile info section -->
  <div class="profile-info">
    <ion-avatar>
      <!-- Later: <img [src]="currentUser?.avatar_url" /> -->
      <ion-icon name="person-outline"></ion-icon>
    </ion-avatar>
    <!-- Later: <h2>{{ currentUser?.name }}</h2> -->
    <h2>Nny James (Static)</h2>
    <!-- Later: <p>{{ currentUser?.roles.join(', ') }}</p> -->
    <p>Electric Guitar, Backup</p>
  </div>
</ion-header>

<ion-content>
  <ion-list lines="full">
    <ion-item button (click)="onAccountSettings()">
      <ion-label>Account Settings</ion-label>
    </ion-item>
    <ion-item button (click)="onNotification()">
      <ion-label>Notification</ion-label>
    </ion-item>
    <ion-item button (click)="onAppReferences()">
      <ion-label>App references</ion-label>
    </ion-item>
    <ion-item button (click)="onSupport()">
      <ion-label>Support</ion-label>
    </ion-item>
    <ion-item button (click)="onLogout()" color="danger">
      <ion-label>Log Out</ion-label>
    </ion-item>
  </ion-list>
</ion-content>
