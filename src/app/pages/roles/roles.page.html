<ion-header>
  <ion-toolbar>
    <ion-title>Roles / Volunteers</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-card *ngIf="isAdmin">
    <ion-card-header>
      <ion-card-title>Add New Member</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <form [formGroup]="addUserForm" (ngSubmit)="onAddUser()">
        <ion-item>
          <ion-label position="floating">Name</ion-label>
          <ion-input formControlName="name"></ion-input>
        </ion-item>
        <ion-item>
          <ion-label position="floating">Email</ion-label>
          <ion-input formControlName="email" type="email"></ion-input>
        </ion-item>
        <ion-item>
          <ion-label position="floating">Password</ion-label>
          <ion-input formControlName="password" type="password"></ion-input>
        </ion-item>
        <ion-item>
          <ion-label position="floating">Role</ion-label>
          <ion-select formControlName="role">
            <ion-select-option value="member">Member</ion-select-option>
            <ion-select-option value="worship leader">Worship Leader</ion-select-option>
          </ion-select>
        </ion-item>
        <ion-button expand="block" type="submit" [disabled]="addUserForm.invalid">Create User</ion-button>
      </form>
    </ion-card-content>
  </ion-card>
</ion-content>
