<!-- ✅ 1. ADD THE SHARED HEADER -->
<ion-header>
  <ion-toolbar color="primary">
    <!-- This title will change based on the active tab -->
    <ion-title>{{ pageTitle }}</ion-title>

    <ion-buttons slot="end">
      <!-- This button navigates to the profile page -->
      <ion-button (click)="goToProfile()" class="profile-button">
        <ion-avatar class="profile-avatar">
          <!-- 
            This is a placeholder. 
            Later, you'll replace this icon with:
            <img [src]="currentUser?.avatar_url" *ngIf="currentUser?.avatar_url" />
          -->
          <ion-icon name="person-outline" color="primary-contrast"></ion-icon>
        </ion-avatar>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<!-- ✅ 2. ADD THE (ionTabsDidChange) EVENT -->
<!-- This event tells the .ts file which tab is active -->
<ion-tabs (ionTabsDidChange)="handleTabsDidChange($event)">
  <ion-tab-bar slot="bottom" color="primary">
    <ion-tab-button tab="home">
      <ion-icon name="home-outline"></ion-icon>
      <ion-label>Home</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="schedule">
      <ion-icon name="calendar-outline"></ion-icon>
      <ion-label>Schedule</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="roles">
      <ion-icon name="hand-left-outline"></ion-icon>
      <ion-label>Roles</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="music">
      <ion-icon name="musical-notes-outline"></ion-icon>
      <ion-label>Songs</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="announcements">
      <ion-icon name="megaphone-outline"></ion-icon>
      <ion-label>News</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
