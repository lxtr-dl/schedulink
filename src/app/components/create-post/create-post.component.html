<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-button (click)="onCancel()">Cancel</ion-button>
    </ion-buttons>
    <ion-title>New Post</ion-title>
    <ion-buttons slot="end">
      <!-- Disable POST button if text is empty -->
      <ion-button (click)="onCreatePost()" [disabled]="!postText.trim()">
        <strong>Post</strong>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item lines="none">
      <ion-avatar slot="start">
        <ion-icon name="person-circle" class="avatar-icon"></ion-icon>
      </ion-avatar>
      <ion-label>
        <h2>{{ currentUser?.name || 'Admin' }}</h2>
      </ion-label>
    </ion-item>

    <ion-item lines="none">
      <!-- The text area for typing the post -->
      <ion-textarea
        [(ngModel)]="postText"
        placeholder="What's on your mind?"
        [autoGrow]="true"
        class="post-textarea"
      ></ion-textarea>
    </ion-item>
  </ion-list>
</ion-content>
